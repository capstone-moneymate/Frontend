name: PR Build & Lint Check

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lint Check
        run: npm run lint
        continue-on-error: true # 빌드 테스트 먼저 진행할 수 있도록 설정

      - name: Build test
        run: npm run build
